apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dashboard-dev.fullname" . }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dashboard-dev.fullname" . }}
                port:
                  number: 80
