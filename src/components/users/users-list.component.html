<!-- <h2>Users List - {{ dataSource().length }} Users</h2> -->

@if (!dataSource().length) {
    <div class="d-flex justify-content-center mt-5"><mat-spinner /></div>
} @else if (dataSource() === null) {
    <div>Failed to load users</div>
} @else {
    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button
            class="btn btn-md btn-secondary float-end mb-4"
            [routerLink]="['/register']"
        >
            register new user
        </button>
    </div>
    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource()">
            @for (el of displayedColumns; track el) {
                <ng-container matColumnDef="{{ el }}">
                    @if (el === 'action') {
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            aria-label="row actions"
                        >
                            action
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- test: {{ { user: element } | json }} -->
                            <ng-container
                                *ngComponentOutlet="
                                    contextMenuCmp;
                                    inputs: { user: element }
                                "
                            />
                        </td>
                    } @else {
                        <th mat-header-cell *matHeaderCellDef>{{ el }}</th>
                        <td
                            mat-cell
                            *matCellDef="let row"
                            [routerLink]="['/profile', row.id]"
                            class="force-pointer"
                        >
                            {{
                                el === 'id'
                                    ? (row[el] | truncate: 3 : 3)
                                    : row[el]
                            }}
                        </td>
                    }
                </ng-container>
            }
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </div>
}
